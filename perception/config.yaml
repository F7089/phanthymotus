mcp_port: 15720

plugins:
  asr:
    enabled: false
    asr_model: paraformer-zh-en   # paraformer-zh-en | zipformer-en
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: false
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: true
    # OpenEPD Melo: voice ONNX tar + separate G2P/OpenEPD assets tar
    backend: melo_openepd
    model_name: tts_melo_openepd_int8
    model_dir: /models/vits-melo-longanlingxin-openepd-nobert-44100-int8
    g2p_model_name: tts_melo_openepd_g2p
    g2p_dir: /models/melo-openepd-g2p-assets
    hw_provider: cuda
    num_threads: 2
    speaker_id: 0
    speed: 0.9
    # TN left to Melo chinese_mix / english (OpenEPD); avoid double TN
    text_normalize: false
    max_segment_chars: 60
    warmup: true
    warmup_async: false
    warmup_texts:
      - "你好"
      - "hello"
    realtime_pacing: false
    noise_scale: 0.6
    noise_scale_w: 0.8

  htmsg:
    enabled: false
    namespace: ""       # auto-detect from hostname if empty
    keyframe:
      dist_thresh: 1.0    # meters — insert keyframe when moved this far
      angle_thresh: 0.35  # radians (~20°) — or rotated this much
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: false
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5
