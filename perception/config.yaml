mcp_port: 15720

plugins:
  asr:
    enabled: false
    asr_model: paraformer-zh-en
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: false
      model_dir: /models/sherpa-onnx/kws
      keywords: []

  tts:
    enabled: true
    # OpenEPD Melo: voice ONNX tar + separate G2P/OpenEPD assets (JuiceFS)
    # Default FP32: QUInt8+CUDA EP is ~27x slower on Orin (Memcpy fallback).
    backend: melo_openepd
    model_name: tts_melo_openepd_fp32_kai
    model_dir: /models/vits-melo-kai-openepd-nobert-44100-fp32
    g2p_model_name: tts_melo_openepd_g2p
    g2p_dir: /models/melo-openepd-g2p-assets
    hw_provider: cuda
    num_threads: 2
    speaker_id: 0
    speed: 0.9
    text_normalize: false
    max_segment_chars: 80
    prefer_single_pass: true
    warmup: true
    warmup_async: false
    warmup_texts:
      - "你好"
      - "hello"
    realtime_pacing: false
    noise_scale: 0.6
    noise_scale_w: 0.8

  htmsg:
    enabled: false
    namespace: ""
    keyframe:
      dist_thresh: 1.0
      angle_thresh: 0.35
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: false
    namespace: ""
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []
    fps: 5
