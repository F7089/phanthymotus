mcp_port: 15720

plugins:
  asr:
    enabled: false
    asr_model: paraformer-zh-en
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: false
      model_dir: /models/sherpa-onnx/kws
      keywords: []

  tts:
    enabled: true
    # Gentleman PhoneTone V1: jieba + ToneSandhi + 94 phone. Not kai lexicon.
    backend: matcha
    model_name: tts_matcha_gentleman
    model_dir: /models/matcha-gentleman-phonetone-16k
    hw_provider: cuda
    # JP5: TTS_MATCHA_TRT=1 native TRT (rebuild cmpf32 from this ONNX).
    # JP6: TTS_MATCHA_TRT=0 PhoneTone ORT CUDA — sherpa cannot load tones/languages.
    num_threads: 2
    speaker_id: 0
    speed: 1.0
    text_normalize: false
    wetext_dir: ""
    max_segment_chars: 80
    prefer_single_pass: true
    warmup: true
    warmup_async: false
    warmup_texts:
      - "你好"
      - "hello"
    realtime_pacing: false
    noise_scale: 0.667
    noise_scale_w: 0.8

  htmsg:
    enabled: false
    namespace: ""
    keyframe:
      dist_thresh: 1.0
      angle_thresh: 0.35
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: false
    namespace: ""
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []
    fps: 5
