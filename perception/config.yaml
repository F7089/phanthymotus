mcp_port: 15720

plugins:
  asr:
    enabled: false
    asr_model: paraformer-zh-en   # paraformer-zh-en | zipformer-en
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: false
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: true
    # Piper dual-G2P MB-iSTFT (longanlingxin B2). Package: piper-longanlingxin-b2.tar.bz2
    backend: piper
    model_name: tts_piper_b2
    model_dir: /models/piper-longanlingxin-b2
    hw_provider: cuda
    num_threads: 2
    speaker_id: 0
    speed: 0.85
    text_normalize: true
    max_segment_chars: 60  # RTF-friendly; shorter segments raise RTF (more ORT runs)
    warmup: true
    warmup_async: false
    # Minimal ZH + EN: heat dual-G2P; keep short to limit sticky ORT workspace.
    warmup_texts:
      - "好。"
      - "YouTube。"
    realtime_pacing: false

  htmsg:
    enabled: false
    namespace: ""       # auto-detect from hostname if empty
    keyframe:
      dist_thresh: 1.0    # meters — insert keyframe when moved this far
      angle_thresh: 0.35  # radians (~20°) — or rotated this much
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: false
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5
